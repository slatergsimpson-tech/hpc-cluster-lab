# Grafana datasource provisioning — dropped into
# /etc/grafana/provisioning/datasources/ so the Prometheus connection
# exists on first boot, no clicking through the UI.
apiVersion: 1

datasources:
  - name: Prometheus
    # Explicit uid: dashboards reference datasources by UID, not name.
    # Dashboard 1860's ${DS_PROMETHEUS} placeholder is replaced with
    # "Prometheus" at deploy time, so the uid must literally be that.
    uid: Prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
