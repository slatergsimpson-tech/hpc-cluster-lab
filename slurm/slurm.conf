# slurm.conf — hpclab cluster definition.
# Deployed identically to /etc/slurm/slurm.conf on every node: controller
# and compute nodes all read the same file and take their role from it.

ClusterName=hpclab
SlurmctldHost=head01

# munge: every RPC between slurm daemons/commands carries a credential
# encoded with the shared /etc/munge/munge.key
AuthType=auth/munge

# The controller runs as an unprivileged 'slurm' user, not root.
SlurmUser=slurm
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPort=6817
SlurmdPort=6818

# A node that reboots and reports healthy goes straight back into service
# instead of sitting DOWN until an admin blesses it.
ReturnToService=1

# Track and contain jobs with cgroups so a runaway process can't escape
# its allocation (see cgroup.conf for the actual limits).
ProctrackType=proctrack/cgroup
TaskPlugin=task/affinity,task/cgroup

# Backfill: small jobs may jump the queue if they fit into scheduling gaps
# without delaying the job at the head — the standard HPC scheduler.
SchedulerType=sched/backfill

# cons_tres: schedule individual cores/memory (multiple jobs per node),
# not whole nodes at a time.
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory

SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log

# Inventory: what each compute node offers the scheduler. RealMemory is
# deliberately below the VM's 3 GB so the OS itself has headroom.
NodeName=node01,node02 CPUs=2 RealMemory=2500 State=UNKNOWN

# One partition (queue). Day cap so a hung job can't squat forever.
PartitionName=debug Nodes=node01,node02 Default=YES MaxTime=1-00:00:00 State=UP
