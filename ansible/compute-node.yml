# compute-node.yml — turn a bare kickstarted Rocky 9 node into a cluster member.
#
# Run from head01:  ansible-playbook -i inventory.ini compute-node.yml
#
# Every task here encodes something we first did (and broke) by hand:
# the slurm user EPEL forgets, the munge key permissions munged rejects,
# the SELinux boolean that locked us out, the NM-owned firewall zone.
# Desired-state, not steps: safe to re-run any time (idempotent).
#
# Single-file playbook for readability; production would split into roles
# (common/munge/slurm/nfs) shared between head and compute plays.

# ---- Play 1: read cluster secrets off the head node -------------------
- name: Collect munge key from head node
  hosts: head
  become: true
  tasks:
    - name: Read munge key
      ansible.builtin.slurp:
        src: /etc/munge/munge.key
      register: munge_key

# ---- Play 2: converge the compute nodes ------------------------------
- name: Configure compute node
  hosts: compute
  become: true
  vars:
    munge_key_b64: "{{ hostvars[groups['head'][0]]['munge_key']['content'] }}"

  tasks:
    - name: EPEL repository
      ansible.builtin.dnf:
        name: epel-release
        state: present

    - name: Cluster packages
      ansible.builtin.dnf:
        name:
          - munge
          - slurm
          - slurm-slurmd
          - nfs-utils
          - openmpi
          - mpitests-openmpi
          # bindings the ansible seboolean module needs on the target
          - python3-libselinux
          - python3-policycoreutils
        state: present

    - name: slurm group (fixed gid — consistent ids cluster-wide)
      ansible.builtin.group:
        name: slurm
        gid: 6001

    - name: slurm user (EPEL's RPM does not create it)
      ansible.builtin.user:
        name: slurm
        uid: 6001
        group: slurm
        shell: /sbin/nologin
        home: /var/spool/slurmctld
        create_home: false

    - name: Cluster name resolution
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} hpclab cluster hosts"
        block: |
          192.168.56.10 head01.hpc.lab head01
          192.168.56.11 node01.hpc.lab node01
          192.168.56.12 node02.hpc.lab node02

    - name: munge key (owner+mode exactly as munged demands)
      ansible.builtin.copy:
        content: "{{ munge_key_b64 | b64decode }}"
        dest: /etc/munge/munge.key
        owner: munge
        group: munge
        mode: "0400"
      notify: restart munge

    - name: slurm.conf and cgroup.conf
      ansible.builtin.copy:
        src: "../slurm/{{ item }}"
        dest: "/etc/slurm/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - slurm.conf
        - cgroup.conf
      notify: restart slurmd

    - name: slurmd spool and log directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.owner }}"
        mode: "0755"
      loop:
        - { path: /var/spool/slurmd, owner: root }
        - { path: /var/log/slurm, owner: slurm }

    - name: Allow sshd to read NFS-backed home directories
      ansible.posix.seboolean:
        name: use_nfs_home_dirs
        state: true
        persistent: true

    - name: Check firewall zone of cluster NIC
      ansible.builtin.command: nmcli -g connection.zone connection show enp0s8
      register: nic_zone
      changed_when: false

    - name: Trust the cluster NIC (NetworkManager owns zone binding on EL9)
      ansible.builtin.command: nmcli connection modify enp0s8 connection.zone trusted
      when: nic_zone.stdout != "trusted"
      notify: reactivate cluster nic

    - name: Mount shared /home from head01
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "head01:/home /home nfs defaults,_netdev 0 0"
        regexp: "^head01:/home"
      register: fstab

    - name: Activate /home mount now
      ansible.builtin.shell: systemctl daemon-reload && mount -a
      when: fstab.changed

    - name: chronyd enabled and running
      ansible.builtin.service:
        name: chronyd
        state: started
        enabled: true

    # munge is a TIME-WINDOWED credential system: a rebuilt node whose clock
    # disagrees with the cluster gets "Invalid authentication credential"
    # and never registers. Step the clock before starting munge/slurmd.
    - name: Force immediate clock sync
      ansible.builtin.command: chronyc makestep
      changed_when: false

    - name: munge and slurmd enabled and running
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - munge
        - slurmd

  handlers:
    - name: restart munge
      ansible.builtin.service:
        name: munge
        state: restarted

    - name: reactivate cluster nic
      ansible.builtin.command: nmcli connection up enp0s8

    - name: restart slurmd
      ansible.builtin.service:
        name: slurmd
        state: restarted

# ---- Play 3: prove the cluster is whole ------------------------------
- name: Verify nodes registered with the controller
  hosts: head
  become: false
  tasks:
    # A node the controller marked down (e.g. it vanished mid-reprovision)
    # stays down until an admin resumes it — that's slurm being cautious,
    # and this task is the admin saying "I rebuilt it on purpose."
    - name: Return down nodes to service
      ansible.builtin.shell: |
        for n in $(sinfo -h -t down -o "%n" | sort -u); do
          scontrol update nodename="$n" state=resume
        done
      become: true
      changed_when: false

    - name: Wait for all compute nodes to report idle
      ansible.builtin.command: sinfo -h -t idle -o "%D"
      register: idle_nodes
      until: idle_nodes.stdout | int >= 2
      retries: 12
      delay: 10
      changed_when: false

    - name: Cluster state
      ansible.builtin.command: sinfo
      register: sinfo_out
      changed_when: false

    - name: Show it
      ansible.builtin.debug:
        msg: "{{ sinfo_out.stdout_lines }}"
