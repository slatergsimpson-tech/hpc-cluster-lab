# ansible.cfg — lab defaults, picked up when running from this directory.
[defaults]
inventory = inventory.ini
# Lab convenience: skip SSH host-key prompts for hosts addressed by IP.
# Production would distribute a managed known_hosts (or use SSH CA
# certificates) instead of turning verification off.
host_key_checking = False
# Quieter output: skip the implicit fact-gathering unless a play asks.
gathering = explicit
# /home is NFS with root_squash: root on a node is 'nobody' on the share,
# so become:true can't read module payloads staged under ~/.ansible.
# Stage them on node-local disk instead.
remote_tmp = /tmp/.ansible-{{ ansible_user_id }}/tmp
